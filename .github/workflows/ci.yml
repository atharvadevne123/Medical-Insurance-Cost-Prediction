name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check . --select E,F,W,I --ignore E501

  test:
    name: Pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx fastapi scipy joblib

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=insurance_predictor \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml
        env:
          PYTHONPATH: .

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  type-check:
    name: Mypy type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install mypy and stubs
        run: pip install mypy pandas-stubs numpy fastapi pydantic scipy scikit-learn
      - name: Run mypy
        run: mypy insurance_predictor/ app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true
